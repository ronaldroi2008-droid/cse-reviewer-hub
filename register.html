<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - ApplySmart Reviewer</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:420px;
    background:#1e293b;
    padding:30px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h2{
    margin-top:0;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

button:hover{
    background:#4338ca;
}

#message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
}

a{
    color:#60a5fa;
    text-decoration:none;
}

.footer{
    margin-top:20px;
    text-align:center;
}

</style>

</head>

<body>

<div class="card">

<h2>Create Free Account</h2>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password (minimum 6 characters)">

<button onclick="registerUser()">
Create Account
</button>

<p id="message"></p>

<div class="footer">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

async function registerUser(){

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    const msg =
    document.getElementById("message");

    msg.style.color="white";

    if(!email){
        msg.innerText="Please enter your email.";
        return;
    }

    if(!password){
        msg.innerText="Please enter your password.";
        return;
    }

    if(password.length < 6){
        msg.innerText="Password must be at least 6 characters.";
        return;
    }

    msg.innerText="Creating account...";

    const { data, error } =
    await supabaseClient.auth.signUp({

        email: email,
        password: password

    });

    if(error){

        msg.style.color="#ef4444";
        msg.innerText=error.message;
        return;

    }

    msg.style.color="#22c55e";

    msg.innerText="Registration successful! Please check your email to verify your account.";

    setTimeout(function(){

        window.location.href="login.html";

    },2000);

}

</script>

</body>
</html>
