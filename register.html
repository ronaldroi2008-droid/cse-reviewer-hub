<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - CSE Reviewer Hub</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 440px;
    background: #1e293b;
    padding: 35px 30px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #334155;
}

h2 {
    margin-top: 0;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #f1f5f9;
}

h2 span {
    color: #818cf8;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #94a3b8;
    font-weight: 500;
}

input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 15px;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #818cf8;
    background: #1e293b;
    box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
}

input::placeholder {
    color: #64748b;
}

input.error {
    border-color: #ef4444;
}

input.success {
    border-color: #22c55e;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-top: 8px;
    position: relative;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
}

button:active:not(:disabled) {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

#message {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    display: none;
    font-weight: 500;
}

#message.success {
    display: block;
    background: #065f46;
    color: #6ee7b7;
    border: 1px solid #047857;
}

#message.error {
    display: block;
    background: #7f1d1d;
    color: #fca5a5;
    border: 1px solid #b91c1c;
}

#message.loading {
    display: block;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
}

#message.info {
    display: block;
    background: #1e3a5f;
    color: #93c5fd;
    border: 1px solid #2563eb;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
}

.footer a {
    color: #818cf8;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.footer a:hover {
    color: #a5b4fc;
    text-decoration: underline;
}

.password-requirements {
    font-size: 12px;
    color: #64748b;
    margin-top: 4px;
    padding-left: 4px;
}

.password-requirements .req {
    display: inline-block;
    margin-right: 12px;
    transition: color 0.3s ease;
}

.password-requirements .req.met {
    color: #22c55e;
}

.password-requirements .req:before {
    content: "• ";
}

.password-requirements .req.met:before {
    content: "✓ ";
}

.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 8px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #334155;
}

.divider span {
    padding: 0 15px;
    color: #64748b;
    font-size: 13px;
}

.terms {
    font-size: 12px;
    color: #64748b;
    text-align: center;
    margin-top: 15px;
    line-height: 1.6;
}

.terms a {
    color: #818cf8;
    text-decoration: none;
}

.terms a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .card {
        padding: 25px 20px;
    }
    
    h2 {
        font-size: 24px;
    }
}

</style>

</head>

<body>

<div class="card">

    <h2>CSE <span>Reviewer</span></h2>
    <p class="subtitle">Create your free account to start reviewing</p>

    <form id="registerForm" onsubmit="return false;">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                placeholder="Juan Dela Cruz"
                autocomplete="name"
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a strong password"
                autocomplete="new-password"
                required
            >
            <div class="password-requirements">
                <span class="req" id="reqLength">6+ characters</span>
                <span class="req" id="reqCase">Uppercase & lowercase</span>
                <span class="req" id="reqNumber">Contains number</span>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit" id="registerBtn">
            Create Account
        </button>

        <div id="message"></div>
    </form>

    <div class="divider">
        <span>or</span>
    </div>

    <div class="footer">
        Already have an account? <a href="login.html">Sign in here</a>
    </div>

    <div class="terms">
        By creating an account, you agree to our 
        <a href="terms.html">Terms of Service</a> and 
        <a href="privacy.html">Privacy Policy</a>
    </div>

</div>

<!-- Supabase Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<!-- Membership System -->
<script src="membership.js"></script>

<script>

// ==========================================
// REGISTER FORM HANDLER
// ==========================================

document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const messageEl = document.getElementById("message");
    const registerBtn = document.getElementById("registerBtn");
    
    // Validate full name
    if (!fullName) {
        showMessage("Please enter your full name.", "error");
        document.getElementById("fullName").focus();
        return;
    }
    
    if (fullName.length < 2) {
        showMessage("Please enter a valid full name.", "error");
        document.getElementById("fullName").focus();
        return;
    }
    
    // Validate email
    if (!email) {
        showMessage("Please enter your email address.", "error");
        document.getElementById("email").focus();
        return;
    }
    
    if (!email.includes("@") || !email.includes(".")) {
        showMessage("Please enter a valid email address.", "error");
        document.getElementById("email").focus();
        return;
    }
    
    // Validate password
    if (!password) {
        showMessage("Please enter a password.", "error");
        document.getElementById("password").focus();
        return;
    }
    
    if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        document.getElementById("password").focus();
        return;
    }
    
    // Check password strength
    const hasUpperCase = /[A-Z]/.test(password);
    const hasLowerCase = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    
    if (!hasUpperCase || !hasLowerCase || !hasNumber) {
        showMessage("Password must contain uppercase, lowercase, and a number.", "error");
        document.getElementById("password").focus();
        return;
    }
    
    // Validate confirm password
    if (!confirmPassword) {
        showMessage("Please confirm your password.", "error");
        document.getElementById("confirmPassword").focus();
        return;
    }
    
    if (password !== confirmPassword) {
        showMessage("Passwords do not match. Please try again.", "error");
        document.getElementById("confirmPassword").focus();
        return;
    }
    
    // Show loading state
    registerBtn.disabled = true;
    registerBtn.innerHTML = `<span class="spinner"></span> Creating account...`;
    showMessage("Creating your account...", "loading");
    
    try {
        // Call the register function from membership.js
        await performRegistration(fullName, email, password);
    } catch (error) {
        console.error("Registration error:", error);
        showMessage("An unexpected error occurred. Please try again.", "error");
        registerBtn.disabled = false;
        registerBtn.innerHTML = "Create Account";
    }
});

// ==========================================
// PERFORM REGISTRATION FUNCTION
// ==========================================

async function performRegistration(fullName, email, password) {
    const messageEl = document.getElementById("message");
    const registerBtn = document.getElementById("registerBtn");
    
    try {
        // Sign up with Supabase
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName
                }
            }
        });
        
        if (error) {
            console.error("❌ Registration error:", error);
            
            // User-friendly error messages
            if (error.message.includes("User already registered")) {
                showMessage("This email is already registered. Please login instead.", "error");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } else if (error.message.includes("Password should be at least")) {
                showMessage("Password must be at least 6 characters.", "error");
            } else {
                showMessage(error.message, "error");
            }
            
            registerBtn.disabled = false;
            registerBtn.innerHTML = "Create Account";
            return;
        }
        
        console.log("✅ User registered:", data.user.email);
        
        // Generate new session ID
        const sessionId = crypto.randomUUID();
        console.log("🆕 Generated session ID:", sessionId);
        
        // Save session_id and full_name to profiles table
        const { error: updateError } = await supabaseClient
            .from("profiles")
            .update({
                session_id: sessionId,
                full_name: fullName,
                is_pro: false
            })
            .eq("id", data.user.id);
        
        if (updateError) {
            console.error("❌ Error saving profile:", updateError);
            showMessage("Account created but profile data could not be saved. Please contact support.", "error");
            registerBtn.disabled = false;
            registerBtn.innerHTML = "Create Account";
            return;
        }
        
        console.log("✅ Profile data saved to database");
        
        // Save session_id to localStorage
        localStorage.setItem("session_id", sessionId);
        console.log("✅ Session_id saved to localStorage");
        
        // Load membership data
        await loadMembership();
        
        // Show success message
        showMessage(
            "✅ Account created successfully! " +
            "Please check your email to verify your account.",
            "success"
        );
        
        registerBtn.innerHTML = "✅ Account Created";
        
        // Redirect to index (homepage) after 3 seconds
        setTimeout(() => {
            window.location.href = "index.html";
        }, 3000);
        
    } catch (error) {
        console.error("❌ Unexpected error:", error);
        showMessage("An unexpected error occurred. Please try again.", "error");
        registerBtn.disabled = false;
        registerBtn.innerHTML = "Create Account";
    }
}

// ==========================================
// SHOW MESSAGE HELPER
// ==========================================

function showMessage(text, type = "info") {
    const messageEl = document.getElementById("message");
    messageEl.textContent = text;
    messageEl.className = type; // success, error, loading, info
    messageEl.style.display = "block";
}

// ==========================================
// PASSWORD STRENGTH INDICATOR
// ==========================================

document.getElementById("password").addEventListener("input", function() {
    const password = this.value;
    
    // Check requirements
    const hasLength = password.length >= 6;
    const hasUpperCase = /[A-Z]/.test(password);
    const hasLowerCase = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasBothCase = hasUpperCase && hasLowerCase;
    
    // Update indicators
    updateRequirement("reqLength", hasLength);
    updateRequirement("reqCase", hasBothCase);
    updateRequirement("reqNumber", hasNumber);
    
    // Check if password meets all requirements
    if (password.length > 0) {
        if (hasLength && hasBothCase && hasNumber) {
            document.getElementById("password").className = "success";
        } else {
            document.getElementById("password").className = "error";
        }
    }
});

function updateRequirement(id, met) {
    const el = document.getElementById(id);
    if (met) {
        el.classList.add("met");
    } else {
        el.classList.remove("met");
    }
}

// ==========================================
// REAL-TIME PASSWORD CONFIRMATION CHECK
// ==========================================

document.getElementById("confirmPassword").addEventListener("input", function() {
    const password = document.getElementById("password").value;
    const confirmPassword = this.value;
    
    if (confirmPassword.length > 0) {
        if (password === confirmPassword) {
            this.className = "success";
        } else {
            this.className = "error";
        }
    } else {
        this.className = "";
    }
});

// ==========================================
// KEYBOARD SHORTCUT - Enter key to submit
// ==========================================

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const registerForm = document.getElementById("registerForm");
        const activeElement = document.activeElement;
        if (activeElement === document.getElementById("fullName") ||
            activeElement === document.getElementById("email") ||
            activeElement === document.getElementById("password") ||
            activeElement === document.getElementById("confirmPassword")) {
            registerForm.dispatchEvent(new Event("submit"));
        }
    }
});

// ==========================================
// CHECK IF ALREADY LOGGED IN
// ==========================================

document.addEventListener("DOMContentLoaded", function() {
    // Check if user is already logged in
    const sessionId = localStorage.getItem("session_id");
    if (sessionId) {
        console.log("ℹ️ User already has a session. Redirecting to index...");
        window.location.href = "index.html";
    }
    
    // Auto-focus on name field
    document.getElementById("fullName").focus();
    
    console.log("🔐 Registration page ready");
});

</script>

</body>
</html>
