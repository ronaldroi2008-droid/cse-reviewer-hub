<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CSE Reviewer Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #1e293b;
    padding: 35px 30px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #334155;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #f1f5f9;
    font-size: 28px;
    font-weight: 700;
}

h2 span {
    color: #818cf8;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #94a3b8;
    font-weight: 500;
}

input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 15px;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #818cf8;
    background: #1e293b;
    box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
}

input::placeholder {
    color: #64748b;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-top: 8px;
    position: relative;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
}

button:active:not(:disabled) {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

#message {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    display: none;
}

#message.success {
    display: block;
    background: #065f46;
    color: #6ee7b7;
    border: 1px solid #047857;
}

#message.error {
    display: block;
    background: #7f1d1d;
    color: #fca5a5;
    border: 1px solid #b91c1c;
}

#message.loading {
    display: block;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
}

.register-link {
    text-align: center;
    margin-top: 20px;
    color: #94a3b8;
    font-size: 14px;
}

.register-link a {
    color: #818cf8;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.register-link a:hover {
    color: #a5b4fc;
    text-decoration: underline;
}

.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 8px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.forgot-password {
    text-align: right;
    margin-top: 8px;
    font-size: 13px;
}

.forgot-password a {
    color: #64748b;
    text-decoration: none;
    transition: color 0.3s ease;
}

.forgot-password a:hover {
    color: #94a3b8;
    text-decoration: underline;
}

.divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #334155;
}

.divider span {
    padding: 0 15px;
    color: #64748b;
    font-size: 13px;
}

@media (max-width: 480px) {
    .card {
        padding: 25px 20px;
    }
    
    h2 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="card">
    <h2>CSE <span>Reviewer</span></h2>
    
    <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                placeholder="you@example.com" 
                required
                autocomplete="email"
            >
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password" 
                required
                autocomplete="current-password"
            >
        </div>
        
        <div class="forgot-password">
            <a href="forgot-password.html">Forgot password?</a>
        </div>
        
        <button type="submit" id="loginBtn">Login</button>
        
        <div id="message"></div>
    </form>
    
    <div class="divider">
        <span>or</span>
    </div>
    
    <div class="register-link">
        Don't have an account? <a href="register.html">Sign up here</a>
    </div>
</div>

<!-- Supabase Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<!-- Membership System -->
<script src="membership.js"></script>

<script>
// ==========================================
// LOGIN FORM HANDLER
// ==========================================

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");
    
    // Validate inputs
    if (!email || !password) {
        showMessage("Please fill in all fields.", "error");
        return;
    }
    
    if (!email.includes("@") || !email.includes(".")) {
        showMessage("Please enter a valid email address.", "error");
        return;
    }
    
    if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
    }
    
    // Show loading state
    loginBtn.disabled = true;
    loginBtn.innerHTML = `<span class="spinner"></span> Logging in...`;
    showMessage("Authenticating...", "loading");
    
    try {
        // Call the login function from membership.js
        await performLogin(email, password);
    } catch (error) {
        console.error("Login error:", error);
        showMessage("An unexpected error occurred. Please try again.", "error");
        loginBtn.disabled = false;
        loginBtn.innerHTML = "Login";
    }
});

// ==========================================
// PERFORM LOGIN FUNCTION
// ==========================================

async function performLogin(email, password) {
    const messageEl = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");
    
    try {
        // Sign in with Supabase
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });
        
        if (error) {
            console.error("❌ Login error:", error);
            
            // User-friendly error messages
            if (error.message.includes("Invalid login credentials")) {
                showMessage("Invalid email or password. Please try again.", "error");
            } else if (error.message.includes("Email not confirmed")) {
                showMessage("Please verify your email address before logging in.", "error");
            } else {
                showMessage(error.message, "error");
            }
            
            loginBtn.disabled = false;
            loginBtn.innerHTML = "Login";
            return;
        }
        
        console.log("✅ User authenticated:", data.user.email);
        
        // Generate new session ID
        const sessionId = crypto.randomUUID();
        console.log("🆕 Generated session ID:", sessionId);
        
        // Save session_id to profiles table
        const { error: updateError } = await supabaseClient
            .from("profiles")
            .update({
                session_id: sessionId
            })
            .eq("id", data.user.id);
        
        if (updateError) {
            console.error("❌ Error saving session_id:", updateError);
            showMessage("Login successful but session could not be saved. Please try again.", "error");
            loginBtn.disabled = false;
            loginBtn.innerHTML = "Login";
            return;
        }
        
        console.log("✅ Session_id saved to database");
        
        // Save session_id to localStorage
        localStorage.setItem("session_id", sessionId);
        console.log("✅ Session_id saved to localStorage");
        
        // Load membership data
        await loadMembership();
        
        // Show success message
        showMessage("✅ Login successful! Redirecting...", "success");
        loginBtn.innerHTML = "✅ Logged in";
        
        // Redirect to dashboard after 1.5 seconds
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1500);
        
    } catch (error) {
        console.error("❌ Unexpected error:", error);
        showMessage("An unexpected error occurred. Please try again.", "error");
        loginBtn.disabled = false;
        loginBtn.innerHTML = "Login";
    }
}

// ==========================================
// SHOW MESSAGE HELPER
// ==========================================

function showMessage(text, type = "info") {
    const messageEl = document.getElementById("message");
    messageEl.textContent = text;
    messageEl.className = type; // success, error, loading
    messageEl.style.display = "block";
}

// ==========================================
// KEYBOARD SHORTCUT - Enter key to submit
// ==========================================

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        const loginForm = document.getElementById("loginForm");
        if (document.activeElement === document.getElementById("email") || 
            document.activeElement === document.getElementById("password")) {
            loginForm.dispatchEvent(new Event("submit"));
        }
    }
});

// ==========================================
// CHECK IF ALREADY LOGGED IN
// ==========================================

document.addEventListener("DOMContentLoaded", function() {
    // Check if user is already logged in
    const sessionId = localStorage.getItem("session_id");
    if (sessionId) {
        // Optional: Redirect to dashboard if already logged in
        // window.location.href = "dashboard.html";
        console.log("ℹ️ User already has a session. Redirecting to dashboard...");
        // Uncomment the line below to auto-redirect
        // window.location.href = "dashboard.html";
    }
    
    // Auto-focus on email field
    document.getElementById("email").focus();
});

// ==========================================
// AUTO-LOGOUT ON SESSION MISMATCH
// ==========================================

// The membership.js handles this automatically
console.log("🔐 Login page ready");
</script>

</body>
</html>
