<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reset Password | CSE Reviewer Hub</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Inter,sans-serif;

background:#0f172a;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

color:white;

}

.card{

width:100%;

max-width:430px;

background:#1e293b;

padding:35px;

border-radius:18px;

border:1px solid #334155;

box-shadow:0 20px 60px rgba(0,0,0,.5);

}

h2{

text-align:center;

font-size:30px;

margin-bottom:10px;

}

h2 span{

color:#818cf8;

}

.subtitle{

text-align:center;

color:#94a3b8;

margin-bottom:30px;

line-height:1.7;

}

.form-group{

margin-bottom:18px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

color:#cbd5e1;

}

input{

width:100%;

padding:14px;

background:#0f172a;

border:2px solid #334155;

border-radius:10px;

color:white;

font-size:15px;

}

input:focus{

outline:none;

border-color:#818cf8;

box-shadow:0 0 0 3px rgba(129,140,248,.2);

}

button{

width:100%;

padding:15px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

font-weight:600;

background:linear-gradient(135deg,#4f46e5,#7c3aed);

color:white;

}

button:hover{

transform:translateY(-2px);

}

#message{

margin-top:18px;

padding:14px;

border-radius:10px;

display:none;

line-height:1.6;

font-size:14px;

}

.success{

display:block;

background:#065f46;

color:#6ee7b7;

border:1px solid #047857;

}

.error{

display:block;

background:#7f1d1d;

color:#fecaca;

border:1px solid #dc2626;

}

.loading{

display:block;

background:#1e293b;

border:1px solid #334155;

}

</style>

</head>

<body>

<div class="card">

<h2>

Reset <span>Password</span>

</h2>

<p class="subtitle">

Enter your new password below.

</p>

<form id="resetForm">

<div class="form-group">

<label>

New Password

</label>

<input
type="password"
id="password"
required>

</div>

<div class="form-group">

<label>

Confirm Password

</label>

<input
type="password"
id="confirmPassword"
required>

</div>

<button
id="resetBtn">

Update Password

</button>

<div id="message"></div>

</form>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const form=document.getElementById("resetForm");

const password=document.getElementById("password");

const confirmPassword=document.getElementById("confirmPassword");

const btn=document.getElementById("resetBtn");

const message=document.getElementById("message");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

message.className="";
message.style.display="none";

if(password.value.length<6){

message.className="error";

message.innerHTML="Password must be at least 6 characters.";

return;

}

if(password.value!==confirmPassword.value){

message.className="error";

message.innerHTML="Passwords do not match.";

return;

}

btn.disabled=true;

btn.innerHTML="Updating Password...";

message.className="loading";

message.innerHTML="Please wait...";

try{

const{error}=await supabaseClient.auth.updateUser({

password:password.value

});

if(error)throw error;

message.className="success";

message.innerHTML=`
<b>✅ Password Updated Successfully!</b>
<br><br>
Redirecting to Login...
`;

setTimeout(()=>{

window.location.href="login.html";

},2000);

}catch(err){

console.error(err);

message.className="error";

message.innerHTML=err.message;

btn.disabled=false;

btn.innerHTML="Update Password";

}

});

</script>

</body>
</html>
