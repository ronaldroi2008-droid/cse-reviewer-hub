<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CSE Reviewer Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #1e293b;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #334155;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h2 span {
            color: #818cf8;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            transition: .3s;
        }

        input:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, .2);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
        }

        .success {
            background: #065f46;
            color: #6ee7b7;
            border: 1px solid #047857;
            display: block !important;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;
            border: 1px solid #dc2626;
            display: block !important;
        }

        .loading {
            background: #1e293b;
            border: 1px solid #334155;
            display: block !important;
        }

        .back {
            margin-top: 22px;
            text-align: center;
        }

        .back a {
            color: #818cf8;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>CSE <span>Reviewer</span></h2>
        <p class="subtitle">
            Enter your registered email address.<br>
            We'll send you a secure password reset link.
        </p>

        <form id="forgotForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <button id="submitBtn" type="submit">
                Send Reset Link
            </button>

            <div id="message"></div>
        </form>

        <div class="back">
            <a href="login.html">
                ← Back to Login
            </a>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const form = document.getElementById("forgotForm");
        const email = document.getElementById("email");
        const btn = document.getElementById("submitBtn");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            message.className = "";
            message.style.display = "none";

            const userEmail = email.value.trim();

            if (userEmail === "") {
                message.className = "error";
                message.innerHTML = "Please enter your email address.";
                message.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Sending...';

            message.className = "loading";
            message.innerHTML = "Sending password reset email...";
            message.style.display = "block";

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(
                    userEmail, {
                        redirectTo: "https://cse.tinylaunch.site/reset-password.html"
                    }
                );

                if (error) throw error;

                message.className = "success";
                message.innerHTML = `
                    <b>✅ Password Reset Email Sent</b>
                    <br><br>
                    Please check your inbox.
                    Click the password reset link inside the email.
                `;
                message.style.display = "block";

                form.reset();

            } catch (err) {
                console.error(err);
                message.className = "error";
                message.innerHTML = err.message;
                message.style.display = "block";
            }

            btn.disabled = false;
            btn.innerHTML = "Send Reset Link";
        });
    </script>
</body>

</html>
